<html>
<head>
  <style>
  table {
    font-family: arial, sans-serif;
    border-collapse: collapse;
    width: 80%;
  }

  td, th {
    border: 1px solid #dddddd;
    text-align: left;
    padding: 8px;
  }

  tr:nth-child(even) {
    background-color: #dddddd;
  }
  </style>
</head>

<body>
  <h1>HTML Example</h1>
  <h2>Table</h2>
<table>
  <tr>
    <td>08:00</td>
    <td>08:10</td>
    <td>Заправить постель</td>
  </tr>
  <tr>
    <td>08:10</td>
    <td>09:00</td>
    <td>Завтрак</td>
  </tr>
  <tr>
    <td>09:00</td>
    <td>11:00</td>
    <td>Чтение книг</td>
  </tr>
</table>
</body>

</html>
